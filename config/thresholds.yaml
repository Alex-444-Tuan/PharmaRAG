# Frozen thresholds. Tune on dev sets only (spec section 11).
# Eval reports record the git commit of this file, which must predate any test-set run.
# All values are the spec's *proposed* defaults until tuned.

resolver:            # spec section 7, decision gate
  resolved_min: 0.90
  margin: 0.05
  ambiguous_min: 0.80
  trigram_min: 0.4
  trigram_k: 5
  max_candidates: 3

retrieval:           # spec section 8
  top_k_per_branch: 20
  rrf_k: 60
  evidence_top_k: 8
  evidence_top_k_per_drug: 5
  # Calibrated 2026-10-06 on a dev set of 90 answerable + 60 unanswerable questions over
  # 15 drugs, filtered retrieval, bge-small-en-v1.5, drug name stripped from the lexical
  # query. Answerable best-dense 0.688-0.884, unanswerable 0.591-0.698. At 0.70 / 3:
  # 89/90 answerable pass on the first attempt, 2/60 unanswerable slip through.
  # The proposed 0.45 / 2 passed 60/60 unanswerable (the weak-evidence path never fired).
  # Re-check with 60 REALISTIC unanswerable questions (comparative effectiveness, Medicare
  # coverage, recalls, patient reviews): best-dense 0.658-0.761, overlapping the answerable
  # range. 45/60 still pass at 0.70; even 0.74 lets 28/60 through while rejecting 10/90
  # answerable. Retrieval scores separate OFF-TOPIC questions, not on-topic-but-unanswerable
  # ones; those are stopped downstream by the writer (INSUFFICIENT) and the verifier.
  # Kept at 0.70 / 3. Script: scripts/calibrate_evidence_thresholds.py
  dense_min: 0.70
  overlap_min: 3
  max_facts: 10

grounding:           # spec section 9
  entail_min: 0.70
  contradict_min: 0.80
  support_ratio_min: 0.8
  candidate_spans: 3          # 5 -> 3 (spec section 9 fallback): per-sentence p95 over budget at 5
  nearest_spans: 3
  premise_context: cascade    # span+neighbour, then span alone on a miss (review round 5)
  premise_heading: sub        # subsection title prefixed to the premise (review round 5)
  # entail_min re-checked 2026-10-15 on the 114-claim dev set (shipped cascade incl. union stage):
  # 0.70 -> FR 4/66 (6.1%), reduction 47/48; 0.60 -> FR 3/66, same reduction. Dev has no H claim
  # between ~0.35 and 0.95, so it cannot separate them; spec value 0.70 kept. Frozen for --score.

graph:               # NFR-6
  max_retrieval_attempts: 2
  max_generation_attempts: 2
  recursion_limit: 12
