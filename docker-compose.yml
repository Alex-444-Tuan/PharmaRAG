# `docker compose up` starts the API, PostgreSQL and Redis on a CPU-only machine.
# Ingestion and evaluation are one-shot profiles:
#   docker compose --profile ingest run --rm ingest
#   docker compose --profile eval run --rm eval lookalike --split test --mode both --runs 3
#
# Settings come from `.env` (copy .env.example). The values under `environment:` below win over
# `.env` on purpose: inside Compose the database and Redis are reachable at their service names,
# whatever a developer's `.env` says for running the API on the host.
#
# File ownership. The image runs as uid 10001. Docker Desktop (macOS, Windows) maps bind mounts
# to your user, so nothing to do. On Linux a bind-mounted ./data or ./reports owned by you is not
# writable by uid 10001, so the one-shot services run as the uid in PHARMARAG_UID/PHARMARAG_GID:
#   PHARMARAG_UID=$(id -u) PHARMARAG_GID=$(id -g) docker compose --profile eval run --rm eval ...
# (`UID` itself is a shell variable that is not exported, so it cannot be used here.) The api
# service writes nothing to the host.

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pharmarag
  REDIS_URL: redis://redis:6379/0
  CACHE_BACKEND: redis

x-app-common: &app-common
  build: .
  image: pharmarag:local
  env_file:
    - path: .env
      required: false # a clean clone has none; the defaults and `environment:` apply
  environment: *app-env

x-one-shot: &one-shot
  <<: *app-common
  user: "${PHARMARAG_UID:-10001}:${PHARMARAG_GID:-10001}"
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmarag
    ports:
      # Loopback only: the database password above is a development default.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmarag"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    # A cache and a rate-limit counter: nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # Loopback only: this Redis has no password.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the schema once and exits. api, ingest and eval wait for it, so a fresh volume works
  # whichever of them is started first, and none of them needs the API to be up.
  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-common
    # The command is the image's CMD: uvicorn with --no-proxy-headers and JSON logs.
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Healthy means /readyz answers 200: database, Redis and both models. start_period covers
      # model loading and warm-up.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  ingest:
    <<: *one-shot
    profiles: ["ingest"]
    command: ["python", "-m", "pharmarag.ingest.run", "--seed", "data/seed_ingredients.csv"]
    # Calls DailyMed and RxNav over the network. `data/` is mounted because the label pins are
    # read and written there.
    volumes:
      - ./data:/app/data

  eval:
    <<: *one-shot
    profiles: ["eval"]
    entrypoint: ["python", "-m", "pharmarag.eval.run"]
    command: ["--help"] # replaced by the arguments of `docker compose run eval <args>`
    volumes:
      - ./reports:/app/reports

volumes:
  pgdata:
