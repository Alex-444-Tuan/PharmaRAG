[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is read from DATABASE_URL via pharmarag.app.settings

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
