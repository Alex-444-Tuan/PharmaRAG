[project]
name = "pharmarag"
version = "0.1.0"
description = "Grounded Q&A over FDA DailyMed drug labels with RxNorm-resolved retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=0.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "torch==2.14.1",  # direct dep so [tool.uv.sources] can route Linux to the CPU index
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharmarag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "pg: needs a running PostgreSQL with pgvector (skipped if unavailable)",
    "network: hits a real external API (skipped unless RUN_NETWORK_TESTS=1)",
    "corpus: reads the ingested pharmarag_dev corpus (skipped if unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

# CPU-only torch on Linux (CI, Docker): avoids ~3 GB of CUDA wheels. macOS keeps PyPI torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
