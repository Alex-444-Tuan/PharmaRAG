name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.8.3"
  HF_HOME: ${{ github.workspace }}/.hf-cache

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmarag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyproject.toml routes torch to the PyTorch CPU index on Linux, so this installs
      # `torch==2.14.1+cpu` and none of the roughly 3 GB of CUDA packages.
      - name: Install dependencies
        run: uv sync --frozen

      # The pinned model commits come from Settings, the one place they are defined, so the
      # cache key changes exactly when the models do.
      - name: Model cache key
        id: models
        run: |
          uv run --no-sync python - >> "$GITHUB_OUTPUT" <<'PY'
          from pharmarag.app.settings import Settings

          s = Settings(_env_file=None)
          print(f"key=hf-{s.embedding_model_revision[:12]}-{s.nli_model_revision[:12]}")
          PY

      - name: Cache Hugging Face models
        id: hf
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ steps.models.outputs.key }}

      # With the models present the tests that load the real NLI model run instead of skipping.
      - name: Download pinned models (cache miss only)
        if: steps.hf.outputs.cache-hit != 'true'
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          from huggingface_hub import snapshot_download
          from huggingface_hub.constants import HF_HUB_CACHE

          from pharmarag.app.settings import Settings

          s = Settings(_env_file=None)
          for repo, rev in (
              (s.embedding_model, s.embedding_model_revision),
              (s.nli_model, s.nli_model_revision),
          ):
              snapshot_download(repo, revision=rev, ignore_patterns=["onnx/*", "openvino/*", "*.onnx", "*.bin"])
              # A download by commit hash writes no refs/main; lookups by name need it.
              refs = Path(HF_HUB_CACHE) / ("models--" + repo.replace("/", "--")) / "refs"
              refs.mkdir(parents=True, exist_ok=True)
              (refs / "main").write_text(rev)
          PY

      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      # Tests marked `corpus` need the ingested dev corpus and skip themselves here. That is
      # expected: the corpus is built from live DailyMed/RxNav data and is not part of CI.
      - name: Test
        run: uv run --frozen pytest -q -ra

  compose:
    name: clean-clone docker compose up
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # NFR-3. A clean clone has no .env, so write the minimum: the fake LLM needs no key.
      - name: Write .env
        run: |
          {
            echo "LLM_PROVIDER=fake"
            echo "LLM_MODEL=fake-llm"
          } > .env

      - uses: docker/setup-buildx-action@v3

      # Tagged as the image name docker-compose.yml uses, so `up --no-build` runs this exact
      # image. The GitHub Actions layer cache keeps the model-download layer between runs; the
      # layer changes when the pinned revisions in the Dockerfile do.
      - name: Build the image (models are downloaded here)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pharmarag:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d --no-build

      - name: Wait for /readyz
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/readyz; then echo; exit 0; fi
            sleep 5
          done
          echo "api never became ready"
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Smoke the other endpoints
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/metrics | grep -q '^pharmarag_http_requests_total'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8000/docs

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
