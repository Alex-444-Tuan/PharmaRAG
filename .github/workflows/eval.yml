# Eval gates (spec section 13, "Eval in CI"): the build fails below target.
#
# No DailyMed, no RxNav, no LLM key and no ingested corpus here. The evals run on the committed CI
# fixture (data/ci_fixture.sql.gz, written by scripts/export_ci_fixture.py), the 40 frozen grounding
# claims, and the committed latency recordings. Run the same three commands locally with
# scripts/load_ci_fixture.sh against a fresh database.
name: eval

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmarag_ci
  # Models are fetched once into the cache below; afterwards nothing needs the network.
  HF_HOME: ${{ github.workspace }}/.hf-cache
  REPORT_DIR: ${{ github.workspace }}/ci-reports

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmarag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the grounding gate records the thresholds file's commit

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Hugging Face models
        id: hf
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          # Bump the suffix if EMBEDDING_MODEL or NLI_MODEL change (config in settings.py).
          key: hf-bge-small-en-v1.5-nli-deberta-v3-small-v1

      - name: Download models (cache miss only)
        if: steps.hf.outputs.cache-hit != 'true'
        run: |
          uv run python - <<'PY'
          from pharmarag.app.settings import Settings
          from sentence_transformers import CrossEncoder, SentenceTransformer

          s = Settings(_env_file=None)
          SentenceTransformer(s.embedding_model, device="cpu")
          CrossEncoder(s.nli_model, device="cpu")
          PY

      - name: Load the CI fixture
        run: scripts/load_ci_fixture.sh "$DATABASE_URL"

      - name: Gate - look-alike (0 wrong-drug resolutions, frozen test set, resolver offline)
        run: >-
          uv run python -m pharmarag.eval.run lookalike
          --split test --mode system --resolver-only --offline --ci
          --out-dir "$REPORT_DIR/lookalike"

      - name: Gate - grounding (AT-2 and AT-2b on the 40 frozen claims)
        run: >-
          uv run python -m pharmarag.eval.run grounding --score --ci
          --out-dir "$REPORT_DIR/grounding"

      - name: Gate - latency (AT-3, replay, real verifier, 10 questions x 3 reps)
        run: >-
          uv run python -m pharmarag.eval.run latency --ci
          --out-dir "$REPORT_DIR/latency"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: ignore
